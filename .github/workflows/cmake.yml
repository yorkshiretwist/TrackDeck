name: trackdeck-compile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  BUILD_TYPE: Release
  BUILD_DIR: build
  PROJECT_NAME: TrackDeck
  PRODUCT_NAME: TrackDeck
  DISPLAY: :0 # linux pluginval needs this

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false # show all errors for each platform (vs. cancel jobs on error)
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - name: Linux
            os: ubuntu-latest
            pluginval-binary: ./pluginval
            extra-flags: -G Ninja
          - name: macOS
            os: macos-latest
            pluginval-binary: pluginval.app/Contents/MacOS/pluginval
            extra-flags: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            pluginval-binary: ./pluginval.exe

    steps:
      # Use clang on Linux so we don't introduce a 3rd compiler (Windows and macOS use MSVC and Clang)
      - name: Set up Clang
        if: runner.os == 'Linux'
        uses: egor-tensin/setup-clang@v1

      # This also starts up our "fake" display (Xvfb), needed for pluginval
      - name: Install JUCE's Linux Deps
        if: runner.os == 'Linux'
        # Official list of Linux deps: https://github.com/juce-framework/JUCE/blob/develop/docs/Linux%20Dependencies.md
        run: |
          sudo apt-get update && sudo apt install libasound2-dev libjack-jackd2-dev \
              ladspa-sdk \
              libcurl4-openssl-dev  \
              libfreetype-dev libfontconfig1-dev \
              libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
              libwebkit2gtk-4.1-dev \
              libglu1-mesa-dev mesa-common-dev
          sudo /usr/bin/Xvfb $DISPLAY &

      - name: "Preparation"
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: "(JUCE) Clone Repository"
        uses: actions/checkout@v2
        with:
          repository: juce-framework/JUCE
          path: ${{runner.workspace}}/trackdeck/JUCE

      - name: "Create Build Environment"
        working-directory: ${{runner.workspace}}/trackdeck
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ matrix.extra-flags }}

      - name: "Build"
        working-directory: ${{runner.workspace}}/trackdeck
        run: cmake --build build --config Release
      
      - name: Set version and additional env vars
        working-directory: ${{runner.workspace}}/trackdeck
        run: |
          VERSION=$(sed -n 's/.*project(TrackDeck VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          ARTIFACTS_PATH=${{ env.BUILD_DIR }}/${{ env.PROJECT_NAME }}_artefacts/${{ env.BUILD_TYPE }}
          echo "ARTIFACTS_PATH=$ARTIFACTS_PATH" >> $GITHUB_ENV
          echo "VST3_PATH=$ARTIFACTS_PATH/VST3/${{ env.PRODUCT_NAME }}.vst3" >> $GITHUB_ENV
          echo "AU_PATH=$ARTIFACTS_PATH/AU/${{ env.PRODUCT_NAME }}.component" >> $GITHUB_ENV
          echo "CLAP_PATH=$ARTIFACTS_PATH/CLAP/${{ env.PRODUCT_NAME }}.clap" >> $GITHUB_ENV

          if [ "${{ matrix.name }}" == "macOS" ]; then
            echo "STANDALONE_PATH=$ARTIFACTS_PATH/Standalone/${{ env.PRODUCT_NAME }}.app" >> $GITHUB_ENV
          elif [ "${{ matrix.name }}" == "Windows" ]; then
            echo "STANDALONE_PATH=$ARTIFACTS_PATH/Standalone/${{ env.PRODUCT_NAME }}.exe" >> $GITHUB_ENV
          else
            echo "STANDALONE_PATH=$ARTIFACTS_PATH/Standalone/${{ env.PRODUCT_NAME }}" >> $GITHUB_ENV
          fi

          echo "ARTIFACT_NAME=${{ env.PRODUCT_NAME }}-${{ env.VERSION }}-${{ matrix.name }}" >> $GITHUB_ENV

      - name: Pluginval
        run: |
          curl -LO "https://github.com/Tracktion/pluginval/releases/download/v1.0.3/pluginval_${{ matrix.name }}.zip"
          7z x pluginval_${{ matrix.name }}.zip
          ${{ matrix.pluginval-binary }} --strictness-level 10 --verbose --validate "${{ env.VST3_PATH }}"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: TrackDeck-${{ matrix.name }}-VST3
          path: ${{ env.VST3_PATH }}

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: TrackDeck-${{ matrix.name }}-Standalone
          path: ${{ env.STANDALONE_PATH }}

      - name: Upload CLAP
        uses: actions/upload-artifact@v4
        with:
          name: TrackDeck-${{ matrix.name }}-CLAP
          path: ${{ env.CLAP_PATH }}

      - name: Upload AU (macOS only)
        if: matrix.name == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TrackDeck-${{ matrix.name }}-AU
          path: ${{ env.AU_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all format artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore executable permissions and zip each one
        working-directory: artifacts
        run: |
          for dir in */; do
            name="${dir%/}"
            find "$name" -type f \( -name "*.exe" -o -path "*Contents/MacOS/*" -o -perm -u+x \) -exec chmod +x {} \; 2>/dev/null || true
            if [[ "$name" == *-VST3 ]]; then
              (cd "$name" && zip -r "../${name}.vst3" .)
            else
              (cd "$name" && zip -r "../${name}-${{ github.ref_name }}.zip" .)
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true